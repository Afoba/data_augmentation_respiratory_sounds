# Experiment configuration — one file per run.
# Same data/loss/optimizer/schedule setup as baseline_icbhi_resnet18.yaml —
# only the `model` block differs. Compare results/<run.name>/metrics.json
# across all three baseline configs (resnet18, vgg11, simple_cnn) to see how
# architecture choice affects performance under otherwise identical settings.
#
# Usage: python src/training/train.py --config config/experiments/baseline_icbhi_vgg11.yaml

run:
  name: baseline_icbhi_vgg11
  seed: 42
  output_dir: results
  device: cuda

data:
  features_cfg: config/features.yaml
  feature_type: logmel
  label_scheme: 4class
  class_list: [normal, crackle, wheeze, both]
  datasets: [icbhi]
  source_types: [real]
  generators: null
  exclude_poor_quality: false

data_loader:
  batch_size: 64
  num_workers: 4
  shuffle_train: true
  weighted_sampler: false
  weighted_sampler_strategy: inverse_sqrt_frequency

augmentation:
  spec_augment:
    enabled: false
    freq_mask_param: 15
    time_mask_param: 25
    n_freq_masks: 2
    n_time_masks: 2
    p: 0.8
  mixup:
    enabled: true
    alpha: 0.4
    label_mode: soft
    p: 0.5

model:
  name: vgg11
  # VGG-11 + the same spectrogram-to-RGB adapter used by resnet18 (1->3
  # channel replication, per-sample [0,1] normalisation, bilinear resize to
  # input_size, then ImageNet mean/std normalisation).
  pretrained: false                   # requires internet access on first run (downloads + caches weights)
  freeze_backbone: false             # true = linear probe, false = full fine-tune.
                                      # NOTE: unlike resnet18, VGG-11's "linear probe" still
                                      # trains a large 3-layer classifier head (~119.5M params
                                      # at default class_list size) — only the convolutional
                                      # feature extractor is frozen, not the whole head. This
                                      # is a much bigger trainable surface than resnet18's
                                      # frozen mode (~2K params), worth knowing when comparing
                                      # "linear probe" results across architectures.
  input_size: [224, 224]             # same role/default as resnet18

loss:
  class_weighting: none
  beta: 0.999
  label_smoothing: 0.0

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001
  momentum: 0.9

scheduler:
  name: cosine
  step_size: 10
  gamma: 0.1

training:
  epochs: 150
  early_stopping_patience: 20
  checkpoint_metric: icbhi_score
  grad_clip_norm: null